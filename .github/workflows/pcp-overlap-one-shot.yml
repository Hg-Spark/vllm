name: PCP prefill overlap one-shot patch

on:
  push:
    branches:
      - wavefront-opt-cleanup
    paths:
      - .github/workflows/pcp-overlap-one-shot.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wavefront-opt-cleanup
          fetch-depth: 0

      - name: Apply pure-prefill receive/local-attention overlap
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('vllm/model_executor/layers/attention/mla_attention.py')
          s = p.read_text()

          old = "from typing import ClassVar, Generic, TypeVar, cast\n"
          new = "from typing import Callable, ClassVar, Generic, TypeVar, cast\n"
          if old not in s:
              raise SystemExit('typing import anchor not found')
          s = s.replace(old, new, 1)

          old = (
              "from vllm.model_executor.layers.attention.pcp import (\n"
              "    finalize_mla_pcp_decode,\n"
              "    maybe_transfer_mla_cache_inputs,\n"
              ")\n"
          )
          new = (
              "from vllm.model_executor.layers.attention.pcp import (\n"
              "    begin_mla_cache_input_transfer,\n"
              "    finalize_mla_pcp_decode,\n"
              "    finish_mla_cache_input_transfer,\n"
              "    maybe_transfer_mla_cache_inputs,\n"
              ")\n"
          )
          if old not in s:
              raise SystemExit('pcp import anchor not found')
          s = s.replace(old, new, 1)

          old = (
              "        quant_tma_aligned: bool | None = None,\n"
              "        q_dcp_replicated: torch.Tensor | None = None,\n"
              "    ) -> torch.Tensor:\n"
          )
          new = (
              "        quant_tma_aligned: bool | None = None,\n"
              "        q_dcp_replicated: torch.Tensor | None = None,\n"
              "        after_local_attention: Callable[[], None] | None = None,\n"
              "    ) -> torch.Tensor:\n"
          )
          if old not in s:
              raise SystemExit('forward_impl signature anchor not found')
          s = s.replace(old, new, 1)

          old = (
              "                output=mha_output[num_mqa_tokens:num_actual_toks],\n"
              "                output_scale=mha_output_scale,\n"
              "            )\n"
          )
          new = (
              "                output=mha_output[num_mqa_tokens:num_actual_toks],\n"
              "                output_scale=mha_output_scale,\n"
              "                after_local_attention=after_local_attention,\n"
              "            )\n"
          )
          if old not in s:
              raise SystemExit('forward_mha call anchor not found')
          s = s.replace(old, new, 1)

          old = (
              "        output: torch.Tensor,\n"
              "        output_scale: torch.Tensor | None = None,\n"
              "    ) -> None:\n"
              "        assert attn_metadata.prefill is not None\n"
          )
          new = (
              "        output: torch.Tensor,\n"
              "        output_scale: torch.Tensor | None = None,\n"
              "        after_local_attention: Callable[[], None] | None = None,\n"
              "    ) -> None:\n"
              "        assert attn_metadata.prefill is not None\n"
          )
          marker = "    def forward_mha(  # type: ignore[override]\n"
          pos = s.find(marker)
          if pos < 0:
              raise SystemExit('forward_mha marker not found')
          prefix, tail = s[:pos], s[pos:]
          if old not in tail:
              raise SystemExit('forward_mha signature anchor not found')
          tail = tail.replace(old, new, 1)
          s = prefix + tail

          old = (
              "        del k, v, k_nope, kv_nope\n\n"
              "        if has_context:\n"
          )
          new = (
              "        del k, v, k_nope, kv_nope\n\n"
              "        # For PCP pure prefill, the receive was posted before local\n"
              "        # attention. Complete the transfer/cache write only now so\n"
              "        # NCCL can overlap the local attention kernels.\n"
              "        if after_local_attention is not None:\n"
              "            after_local_attention()\n\n"
              "        if has_context:\n"
          )
          pos = s.find(marker)
          prefix, tail = s[:pos], s[pos:]
          if old not in tail:
              raise SystemExit('after-local callback anchor not found')
          s = prefix + tail.replace(old, new, 1)

          old = (
              "            layer_slot_mapping = slot_mapping.get(self.layer_name)\n"
              "            kv_for_cache, kpe_for_cache, layer_slot_mapping = (\n"
              "                maybe_transfer_mla_cache_inputs(\n"
              "                    kv_c_normed,\n"
              "                    k_pe,\n"
              "                    layer_slot_mapping,\n"
              "                    attn_metadata.num_decode_tokens\n"
              "                    if attn_metadata is not None\n"
              "                    else None,\n"
              "                    self.use_pcp,\n"
              "                )\n"
              "            )\n"
              "            self.impl.do_kv_cache_update(  # type: ignore[attr-defined]\n"
              "                kv_for_cache,\n"
              "                kpe_for_cache,\n"
              "                self_kv_cache,\n"
              "                layer_slot_mapping,\n"
              "                self.kv_cache_dtype,\n"
              "                self._k_scale,\n"
              "            )\n"
              "            # The cache update is the last consumer in this scope. Rank0's\n"
              "            # async send retains source tensors until its P2P work completes.\n"
              "            del kv_for_cache, kpe_for_cache\n"
              "            output = torch.empty(output_shape, dtype=q.dtype, device=q.device)\n"
          )
          new = (
              "            layer_slot_mapping = slot_mapping.get(self.layer_name)\n"
              "            after_local_attention: Callable[[], None] | None = None\n"
              "            use_pcp_prefill_overlap = (\n"
              "                self.use_pcp\n"
              "                and attn_metadata is not None\n"
              "                and attn_metadata.num_decode_tokens == 0\n"
              "                and layer_slot_mapping is not None\n"
              "                and not self.impl.is_sparse\n"
              "            )\n"
              "            if use_pcp_prefill_overlap:\n"
              "                pending_cache_transfer = begin_mla_cache_input_transfer(\n"
              "                    (kv_c_normed, k_pe.flatten(1)),\n"
              "                    layer_slot_mapping,\n"
              "                )\n\n"
              "                def _finish_pcp_cache_update() -> None:\n"
              "                    (cache_inputs, cache_slot_mapping) = (\n"
              "                        finish_mla_cache_input_transfer(\n"
              "                            pending_cache_transfer\n"
              "                        )\n"
              "                    )\n"
              "                    cache_kv_c, cache_k_pe_flat = cache_inputs\n"
              "                    cache_k_pe = cache_k_pe_flat.view(\n"
              "                        -1, *k_pe.shape[1:]\n"
              "                    )\n"
              "                    self.impl.do_kv_cache_update(  # type: ignore[attr-defined]\n"
              "                        cache_kv_c,\n"
              "                        cache_k_pe,\n"
              "                        self_kv_cache,\n"
              "                        cache_slot_mapping,\n"
              "                        self.kv_cache_dtype,\n"
              "                        self._k_scale,\n"
              "                    )\n\n"
              "                after_local_attention = _finish_pcp_cache_update\n"
              "            else:\n"
              "                kv_for_cache, kpe_for_cache, layer_slot_mapping = (\n"
              "                    maybe_transfer_mla_cache_inputs(\n"
              "                        kv_c_normed,\n"
              "                        k_pe,\n"
              "                        layer_slot_mapping,\n"
              "                        attn_metadata.num_decode_tokens\n"
              "                        if attn_metadata is not None\n"
              "                        else None,\n"
              "                        self.use_pcp,\n"
              "                    )\n"
              "                )\n"
              "                self.impl.do_kv_cache_update(  # type: ignore[attr-defined]\n"
              "                    kv_for_cache,\n"
              "                    kpe_for_cache,\n"
              "                    self_kv_cache,\n"
              "                    layer_slot_mapping,\n"
              "                    self.kv_cache_dtype,\n"
              "                    self._k_scale,\n"
              "                )\n"
              "                # The cache update is the last consumer in this scope.\n"
              "                # Rank0 async send retains its source until completion.\n"
              "                del kv_for_cache, kpe_for_cache\n"
              "            output = torch.empty(output_shape, dtype=q.dtype, device=q.device)\n"
          )
          if old not in s:
              raise SystemExit('direct-call cache update block not found')
          s = s.replace(old, new, 1)

          old = (
              "                output=output,\n"
              "                q_dcp_replicated=q_dcp_replicated,\n"
              "            )\n"
              "            return output\n"
          )
          new = (
              "                output=output,\n"
              "                q_dcp_replicated=q_dcp_replicated,\n"
              "                after_local_attention=after_local_attention,\n"
              "            )\n"
              "            return output\n"
          )
          if old not in s:
              raise SystemExit('direct forward_impl call anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY

          python -m py_compile \
            vllm/model_executor/layers/attention/mla_attention.py \
            vllm/model_executor/layers/attention/pcp.py \
            vllm/model_executor/layers/attention/pcp_wavefront_runtime.py

          git config user.name "OpenAI PCP patch"
          git config user.email "pcp-patch@users.noreply.github.com"
          git add vllm/model_executor/layers/attention/mla_attention.py
          git commit -m "[PCP] Overlap pure-prefill receive with local MLA attention"

      - name: Push overlap commit
        shell: bash
        run: |
          git pull --rebase origin wavefront-opt-cleanup
          git push origin HEAD:wavefront-opt-cleanup
