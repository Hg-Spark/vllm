name: Port PCP to v0.27.1

on:
  pull_request:
    branches:
      - baseline0.27.1

permissions:
  contents: write

jobs:
  port:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Port PCP patch onto v0.27.1
        shell: bash
        run: |
          set -euxo pipefail
          git fetch --no-tags origin baseline0.27.1 pcp-runahead pcp-runahead-v0.27.1
          git switch --detach origin/baseline0.27.1
          git switch -C pcp-runahead-v0.27.1
          git diff --binary b01728b0880ca419bb41199523535457f4ab0010..origin/pcp-runahead > /tmp/pcp-runahead.patch
          git apply --3way /tmp/pcp-runahead.patch || true

          # Keep the v0.27.1 CI workflow; the PCP workflow change is unrelated to runtime.
          git checkout --ours .github/workflows/pre-commit.yml
          git add -- .github/workflows/pre-commit.yml

          # Resolve the v0.27.1 manager-construction conflict and restore the
          # custom-manager hook that the PCP patch's source base already had.
          python - <<'PY'
          from pathlib import Path

          path = Path("vllm/v1/worker/gpu/pcp_manager.py")
          text = path.read_text()

          sig_old = "    block_tables: BlockTables,\n) -> PCPManager | None:\n"
          sig_new = (
              "    block_tables: BlockTables,\n"
              "    cls: type[PCPManager] = PCPManager,\n"
              ") -> PCPManager | None:\n"
          )
          if "cls: type[PCPManager] = PCPManager" not in text:
              if sig_old not in text:
                  raise SystemExit("could not locate maybe_build_pcp_manager signature")
              text = text.replace(sig_old, sig_new, 1)

          conflict1 = '''<<<<<<< ours
              PCPManager.validate_config(vllm_config, supports_mm_inputs)
          =======
              manager_cls = cls
              if parallel_config.prefill_context_parallel_mode == "runahead":
                  if cls is not PCPManager:
                      raise NotImplementedError(
                          "runahead PCP does not support a custom PCP manager class"
                      )
                  manager_cls = RunaheadPCPManager

              manager_cls.validate_config(vllm_config, supports_mm_inputs)
          >>>>>>> theirs
          '''
          resolved1 = '''    manager_cls = cls
              if parallel_config.prefill_context_parallel_mode == "runahead":
                  if cls is not PCPManager:
                      raise NotImplementedError(
                          "runahead PCP does not support a custom PCP manager class"
                      )
                  manager_cls = RunaheadPCPManager

              manager_cls.validate_config(vllm_config, supports_mm_inputs)
          '''
          if conflict1 not in text:
              raise SystemExit("expected first pcp_manager conflict not found")
          text = text.replace(conflict1, resolved1, 1)

          conflict2 = '''<<<<<<< ours
              return PCPManager(
          =======
              manager = manager_cls(
          >>>>>>> theirs
          '''
          resolved2 = '''    manager = manager_cls(
          '''
          if conflict2 not in text:
              raise SystemExit("expected second pcp_manager conflict not found")
          text = text.replace(conflict2, resolved2, 1)

          if "<<<<<<<" in text or "=======" in text or ">>>>>>>" in text:
              raise SystemExit("unresolved conflict marker remains")
          path.write_text(text)
          PY
          git add -- vllm/v1/worker/gpu/pcp_manager.py

          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --check

          python -m py_compile \
            tests/v1/attention/test_pcp_runahead_runtime.py \
            tests/v1/attention/test_pcp_standard.py \
            tests/v1/worker/gpu/test_pcp_runahead.py \
            vllm/config/__init__.py \
            vllm/config/parallel.py \
            vllm/engine/arg_utils.py \
            vllm/model_executor/layers/attention/mla_attention.py \
            vllm/model_executor/layers/attention/pcp.py \
            vllm/model_executor/layers/sparse_attn_indexer.py \
            vllm/v1/attention/ops/pcp_profile.py \
            vllm/v1/attention/ops/pcp_runahead.py \
            vllm/v1/attention/ops/pcp_standard.py \
            vllm/v1/worker/gpu/model_runner.py \
            vllm/v1/worker/gpu/pcp_manager.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            docs/design/pcp_runahead.md \
            tests/v1/attention/test_pcp_runahead_runtime.py \
            tests/v1/attention/test_pcp_standard.py \
            tests/v1/worker/gpu/test_pcp_runahead.py \
            vllm/config/__init__.py \
            vllm/config/parallel.py \
            vllm/engine/arg_utils.py \
            vllm/model_executor/layers/attention/mla_attention.py \
            vllm/model_executor/layers/attention/pcp.py \
            vllm/model_executor/layers/sparse_attn_indexer.py \
            vllm/v1/attention/ops/pcp_profile.py \
            vllm/v1/attention/ops/pcp_runahead.py \
            vllm/v1/attention/ops/pcp_standard.py \
            vllm/v1/worker/gpu/model_runner.py \
            vllm/v1/worker/gpu/pcp_manager.py
          git commit -m "Port PCP runahead onto vLLM v0.27.1"
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/baseline0.27.1)"
          git push --force-with-lease=refs/heads/pcp-runahead-v0.27.1:6acce7cdc228f915130626f7597307723fcda7eb origin HEAD:refs/heads/pcp-runahead-v0.27.1
