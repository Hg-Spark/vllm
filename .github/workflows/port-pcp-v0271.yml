name: Port PCP to v0.27.1

on:
  push:
    branches:
      - automation/port-pcp-v0271

permissions:
  contents: write

jobs:
  port:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply PCP patch onto v0.27.1
        shell: bash
        run: |
          set -euxo pipefail
          git fetch --no-tags origin baseline0.27.1 pcp-runahead pcp-runahead-v0.27.1
          git switch --detach origin/baseline0.27.1
          git switch -C pcp-runahead-v0.27.1
          git diff --binary b01728b0880ca419bb41199523535457f4ab0010..origin/pcp-runahead > /tmp/pcp-runahead.patch
          git apply --3way /tmp/pcp-runahead.patch
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .github/workflows/pre-commit.yml docs/design/pcp_runahead.md tests/v1/attention/test_pcp_runahead_runtime.py tests/v1/attention/test_pcp_standard.py tests/v1/worker/gpu/test_pcp_runahead.py vllm/config/__init__.py vllm/config/parallel.py vllm/engine/arg_utils.py vllm/model_executor/layers/attention/mla_attention.py vllm/model_executor/layers/attention/pcp.py vllm/model_executor/layers/sparse_attn_indexer.py vllm/v1/attention/ops/pcp_profile.py vllm/v1/attention/ops/pcp_runahead.py vllm/v1/attention/ops/pcp_standard.py vllm/v1/worker/gpu/model_runner.py vllm/v1/worker/gpu/pcp_manager.py
          git commit -m "Port PCP runahead onto vLLM v0.27.1"
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/baseline0.27.1)"
          git push --force-with-lease=refs/heads/pcp-runahead-v0.27.1:6acce7cdc228f915130626f7597307723fcda7eb origin HEAD:refs/heads/pcp-runahead-v0.27.1
