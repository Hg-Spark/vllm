name: Port PCP to v0.27.1

on:
  push:
    branches:
      - automation/port-pcp-v0271
  pull_request:
    branches:
      - baseline0.27.1

permissions:
  contents: write

jobs:
  port:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Diagnose PCP patch conflicts on v0.27.1
        shell: bash
        run: |
          set -euxo pipefail
          git fetch --no-tags origin baseline0.27.1 pcp-runahead pcp-runahead-v0.27.1
          git switch --detach origin/baseline0.27.1
          git switch -C pcp-runahead-v0.27.1
          git diff --binary b01728b0880ca419bb41199523535457f4ab0010..origin/pcp-runahead > /tmp/pcp-runahead.patch
          if ! git apply --3way /tmp/pcp-runahead.patch; then
            echo '===== pre-commit conflict ====='
            grep -n -C 50 '<<<<<<<' .github/workflows/pre-commit.yml || true
            echo '===== pcp_manager conflict ====='
            grep -n -C 100 '<<<<<<<' vllm/v1/worker/gpu/pcp_manager.py || true
            echo '===== pcp_manager baseline->old-base diff ====='
            git diff --unified=40 origin/baseline0.27.1 b01728b0880ca419bb41199523535457f4ab0010 -- vllm/v1/worker/gpu/pcp_manager.py || true
            echo '===== pcp_manager old-base->PCP diff ====='
            git diff --unified=40 b01728b0880ca419bb41199523535457f4ab0010 origin/pcp-runahead -- vllm/v1/worker/gpu/pcp_manager.py || true
            exit 1
          fi
