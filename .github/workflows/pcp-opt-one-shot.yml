name: PCP optimization one-shot patch

on:
  push:
    branches:
      - wavefront-opt-cleanup
    paths:
      - .github/workflows/pcp-opt-one-shot.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wavefront-opt-cleanup
          fetch-depth: 0

      - name: Preserve prompt-logprobs fallback for compact PCP sampling restore
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('vllm/v1/worker/gpu/pcp_manager.py')
          s = p.read_text()
          old = (
              "    def restore_for_sampling(\n"
              "        self,\n"
              "        hidden_states: torch.Tensor,\n"
              "    ) -> tuple[torch.Tensor, InputBatch]:\n"
          )
          new = (
              "    def global_batch_uses_prompt_logprobs(\n"
              "        self,\n"
              "        uses_prompt_logprobs: np.ndarray,\n"
              "    ) -> bool:\n"
              "        assert self._global_batch is not None\n"
              "        return bool(\n"
              "            np.any(uses_prompt_logprobs[self._global_batch.idx_mapping_np])\n"
              "        )\n\n"
              "    def restore_for_sampling(\n"
              "        self,\n"
              "        hidden_states: torch.Tensor,\n"
              "        force_full: bool = False,\n"
              "    ) -> tuple[torch.Tensor, InputBatch]:\n"
          )
          if old not in s:
              raise SystemExit('pcp_manager restore_for_sampling signature not found')
          s = s.replace(old, new, 1)

          old = (
              "        global_batch = self._global_batch\n"
              "        selected_hidden_states = self.restore_selected_hidden_states(\n"
          )
          new = (
              "        global_batch = self._global_batch\n"
              "        if force_full:\n"
              "            return self.restore_hidden_states(hidden_states), global_batch\n"
              "        selected_hidden_states = self.restore_selected_hidden_states(\n"
          )
          if old not in s:
              raise SystemExit('pcp_manager force_full insertion anchor not found')
          s = s.replace(old, new, 1)

          old = (
              "def maybe_restore_pcp_for_sampling(\n"
              "    manager: PCPManager | None,\n"
              "    hidden_states: torch.Tensor | None,\n"
              "    input_batch: InputBatch,\n"
              ") -> tuple[torch.Tensor, InputBatch]:\n"
          )
          new = (
              "def maybe_restore_pcp_for_sampling(\n"
              "    manager: PCPManager | None,\n"
              "    hidden_states: torch.Tensor | None,\n"
              "    input_batch: InputBatch,\n"
              "    force_full: bool = False,\n"
              ") -> tuple[torch.Tensor, InputBatch]:\n"
          )
          if old not in s:
              raise SystemExit('pcp_manager helper signature not found')
          s = s.replace(old, new, 1)
          old = "    return manager.restore_for_sampling(hidden_states)\n"
          new = "    return manager.restore_for_sampling(hidden_states, force_full=force_full)\n"
          if old not in s:
              raise SystemExit('pcp_manager helper call not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('vllm/v1/worker/gpu/model_runner.py')
          s = p.read_text()
          old = (
              "        # Last rank: sample tokens\n"
              "        hidden_states, input_batch = pcp.maybe_restore_pcp_for_sampling(\n"
              "            self.pcp_manager, hidden_states, input_batch\n"
              "        )\n"
          )
          new = (
              "        # Last rank: sample tokens. Prompt-logprobs consumes the full\n"
              "        # global hidden-state layout, so retain the full restore only\n"
              "        # for batches that actually request prompt logprobs.\n"
              "        force_full_pcp_hidden = False\n"
              "        if self.pcp_manager is not None:\n"
              "            assert self.prompt_logprobs_worker is not None\n"
              "            force_full_pcp_hidden = (\n"
              "                self.pcp_manager.global_batch_uses_prompt_logprobs(\n"
              "                    self.prompt_logprobs_worker.uses_prompt_logprobs\n"
              "                )\n"
              "            )\n"
              "        hidden_states, input_batch = pcp.maybe_restore_pcp_for_sampling(\n"
              "            self.pcp_manager,\n"
              "            hidden_states,\n"
              "            input_batch,\n"
              "            force_full=force_full_pcp_hidden,\n"
              "        )\n"
          )
          if old not in s:
              raise SystemExit('model_runner sampling restore anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY

          git config user.name "OpenAI PCP patch"
          git config user.email "pcp-patch@users.noreply.github.com"
          git add vllm/v1/worker/gpu/pcp_manager.py vllm/v1/worker/gpu/model_runner.py
          if ! git diff --cached --quiet; then
            git commit -m "[PCP] Preserve full hidden restore for prompt logprobs"
          fi

      - name: Shorten MLA temporary tensor lifetimes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('vllm/model_executor/layers/attention/mla_attention.py')
          s = p.read_text()

          old = (
              "            self.impl.do_kv_cache_update(  # type: ignore[attr-defined]\n"
              "                kv_for_cache,\n"
              "                kpe_for_cache,\n"
              "                self_kv_cache,\n"
              "                layer_slot_mapping,\n"
              "                self.kv_cache_dtype,\n"
              "                self._k_scale,\n"
              "            )\n"
              "            output = torch.empty(output_shape, dtype=q.dtype, device=q.device)\n"
          )
          new = (
              "            self.impl.do_kv_cache_update(  # type: ignore[attr-defined]\n"
              "                kv_for_cache,\n"
              "                kpe_for_cache,\n"
              "                self_kv_cache,\n"
              "                layer_slot_mapping,\n"
              "                self.kv_cache_dtype,\n"
              "                self._k_scale,\n"
              "            )\n"
              "            # The cache update is the last consumer in this scope. Rank0's\n"
              "            # async send retains source tensors until its P2P work completes.\n"
              "            del kv_for_cache, kpe_for_cache\n"
              "            output = torch.empty(output_shape, dtype=q.dtype, device=q.device)\n"
          )
          if old not in s:
              raise SystemExit('MLA cache-update lifetime anchor not found')
          s = s.replace(old, new, 1)

          old = (
              "            output_scale=output_scale,\n"
              "        )\n\n"
              "        if has_context:\n"
          )
          new = (
              "            output_scale=output_scale,\n"
              "        )\n"
              "        # Release expanded local K/V before chunked context K/V is\n"
              "        # projected. CUDA allocator reuse remains stream ordered.\n"
              "        del k, v, k_nope, kv_nope\n\n"
              "        if has_context:\n"
          )
          # Restrict this replacement to forward_mha by starting after its signature.
          marker = "    def forward_mha(  # type: ignore[override]\n"
          pos = s.find(marker)
          if pos < 0:
              raise SystemExit('forward_mha marker not found')
          prefix, tail = s[:pos], s[pos:]
          if old not in tail:
              raise SystemExit('MLA local-KV lifetime anchor not found')
          p.write_text(prefix + tail.replace(old, new, 1))
          PY

          git add vllm/model_executor/layers/attention/mla_attention.py
          if ! git diff --cached --quiet; then
            git commit -m "[PCP] Shorten MLA prefill temporary lifetimes"
          fi

      - name: Push patch commits
        shell: bash
        run: |
          git pull --rebase origin wavefront-opt-cleanup
          git push origin HEAD:wavefront-opt-cleanup
