name: PCP optimization syntax validation

on:
  push:
    branches:
      - wavefront-opt-cleanup
    paths:
      - .github/workflows/pcp-opt-one-shot.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wavefront-opt-cleanup
      - name: Compile modified Python paths
        run: |
          python -m py_compile \
            vllm/model_executor/layers/attention/pcp.py \
            vllm/model_executor/layers/attention/pcp_wavefront_runtime.py \
            vllm/model_executor/layers/attention/mla_attention.py \
            vllm/v1/worker/gpu/pcp_manager.py \
            vllm/v1/worker/gpu/model_runner.py
