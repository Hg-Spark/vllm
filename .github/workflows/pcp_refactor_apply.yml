          text = text.replace(
              '''    layout = manager._compile_segment_layout(_batch([12]))\n    rank1 = layout.segments_by_rank[1]\n''',
              '''    layout = manager._compile_segment_layout(_batch([12]))\n    assert layout is not None\n    rank1 = layout.segments_by_rank[1]\n''',
          )
          old_restore = '''    manager._pcp_group = MagicMock()\n    manager._pcp_group.all_gatherv.return_value = torch.arange(5).view(5, 1)\n    restored = manager.restore_hidden_states(torch.arange(2).view(2, 1))\n    manager._pcp_group.all_gatherv.assert_called_once()\n    manager._pcp_group.all_gather.assert_not_called()\n    assert restored[:, 0].tolist() == [0, 1, 2, 3]\n'''
          new_restore = '''    group = MagicMock()\n    group.all_gatherv.return_value = torch.arange(5).view(5, 1)\n    from unittest.mock import patch\n\n    with patch(\n        "vllm.v1.worker.gpu.pcp_manager.get_pcp_group", return_value=group\n    ):\n        restored = manager.restore_hidden_states(torch.arange(2).view(2, 1))\n    group.all_gatherv.assert_called_once()\n    group.all_gather.assert_not_called()\n    assert restored[:, 0].tolist() == [0, 1, 2, 3]\n'''
          if old_restore not in text:
              raise RuntimeError("compact restore test block changed")
          text = text.replace(old_restore, new_restore)
          insert_before = '''def test_boolean_config_is_rejected() -> None:\n'''
          additions = '''def test_legacy_top_level_weights_are_rejected() -> None:\n    with pytest.raises(ValueError, match="was removed"):\n        parse_pcp_runahead_config(\n            {\n                "pcp_runahead_weights": [1, 1],\n                "pcp_runahead": {"transport": "prefix_p2p"},\n            },\n            2,\n        )\n\n\ndef test_page_pull_accepts_dense_nhd_physical_pages() -> None:\n    physical = torch.empty((8, 16, 2, 32))\n    logical_nhd = physical.permute(0, 2, 1, 3)\n    assert not logical_nhd[0].is_contiguous()\n    num_blocks, block_bytes = PCPPagePullTransport._physical_page_geometry(\n        logical_nhd\n    )\n    assert num_blocks == 8\n    assert block_bytes == 16 * 2 * 32 * logical_nhd.element_size()\n\n\n'''
          if insert_before not in text:
              raise RuntimeError("test insertion point changed")
          text = text.replace(insert_before, additions + insert_before, 1)
          p.write_text(text)

          p = Path("tests/v1/attention/test_pcp_standard.py")
          text = p.read_text()
          text = text.replace(
              '''from vllm.v1.attention.ops.pcp_standard import prepare_standard_pcp_kv_cache_inputs\n''',
              '''from vllm.v1.attention.ops.pcp_standard import (\n    finish_standard_pcp_kv_cache_update,\n    prepare_standard_pcp_kv_cache_inputs,\n)\n''',
          )
          marker = '''def test_standard_compact_full_kv_collective_uses_allgatherv_for_variable_width() -> None:\n'''
          addition = '''def test_page_pull_finish_runs_after_native_cache_write() -> None:\n    kv_cache = _flash_kv_cache()\n    runtime = MagicMock()\n    runtime.transport = "page_pull"\n    with patch(\n        "vllm.v1.attention.ops.pcp_standard.get_pcp_runahead_runtime",\n        return_value=runtime,\n    ):\n        finish_standard_pcp_kv_cache_update(kv_cache)\n    runtime.page_pull_after_cache_write.assert_called_once_with(kv_cache)\n\n\n'''
          if marker not in text:
              raise RuntimeError("standard test insertion point changed")
          text = text.replace(marker, addition + marker, 1)
          p.write_text(text)

          # Keep the design document honest without adding another abstraction.
          p = Path("docs/design/pcp_runahead.md")
          text = p.read_text()
          text = text.replace(
              "logical segment order from physical PCP rank",
              "logical segment order from physical PCP rank; one-to-one permutations are compiled into the primary PCP process-group member order",
          )
          text = text.replace(
              "all_gather_object",
              "CPU block-table plan",
          )
          p.write_text(text)
          PY

