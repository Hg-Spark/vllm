name: Apply PCP simplification refactor

on:
  push:
    branches:
      - pcp-segment-rank-binding-refactor-v0.27.1

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pcp-segment-rank-binding-refactor-v0.27.1
          fetch-depth: 0

      - name: Apply simplification
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, *, count: int = 1) -> None:
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise RuntimeError(
                      f"{path}: expected {count} occurrence(s), found {actual} for:\n{old[:240]}"
                  )
              p.write_text(text.replace(old, new, count))

          # -----------------------------------------------------------------
          # Config: one canonical mapping. Permutations are compiled into the
          # primary PCP process-group order; repeated ownership remains in the
          # page-pull plan only.
          # -----------------------------------------------------------------
          Path("vllm/v1/worker/gpu/pcp_runahead_config.py").write_text(r'''# SPDX-License-Identifier: Apache-2.0
          # SPDX-FileCopyrightText: Copyright contributors to the vLLM project
          """Configuration parsing for the experimental PCP runahead path."""

          from __future__ import annotations

          import math
          from dataclasses import dataclass
          from typing import Literal

          TransportPolicy = Literal[
              "full_kv_collective",
              "prefix_p2p",
              "direct_p2p",
              "page_pull",
          ]

          RUNAHEAD_CONFIG_KEY = "pcp_runahead"
          RUNAHEAD_MIN_PREFILL_TOKENS = 1024


          @dataclass(frozen=True)
          class PCPRunaheadConfig:
              """Runtime axes that remain variable in PCP runahead."""

              pcp_world_size: int
              transport: TransportPolicy
              weights: tuple[float, ...]
              segment_to_rank: tuple[int, ...]
              min_tokens: int = RUNAHEAD_MIN_PREFILL_TOKENS
              max_inflight_sends: int = 4
              max_inflight_reads: int = 4
              nixl_backends: tuple[str, ...] = ("UCX",)

              @property
              def mapping_is_permutation(self) -> bool:
                  return is_rank_permutation(self.segment_to_rank, self.pcp_world_size)

              @property
              def logical_segment_to_rank(self) -> tuple[int, ...]:
                  """Ownership in the already-ordered primary PCP communicator."""
                  if self.mapping_is_permutation:
                      return tuple(range(self.pcp_world_size))
                  return self.segment_to_rank


          def parse_runahead_weights(
              raw: object,
              pcp_world_size: int,
          ) -> tuple[float, ...] | None:
              if raw is None:
                  return None
              if not isinstance(raw, (list, tuple)) or len(raw) != pcp_world_size:
                  got = len(raw) if isinstance(raw, (list, tuple)) else type(raw).__name__
                  raise ValueError(
                      f"weights requires {pcp_world_size} positive values, got {got}: {raw}"
                  )
              try:
                  weights = tuple(float(value) for value in raw)
              except (TypeError, ValueError) as exc:
                  raise ValueError(f"weights values must be numeric: {raw}") from exc
              if any(not math.isfinite(weight) or weight <= 0 for weight in weights):
                  raise ValueError(f"weights values must be finite and positive: {weights}")
              return weights


          def parse_runahead_segments(
              raw: object,
              pcp_world_size: int,
          ) -> tuple[tuple[float, ...], tuple[int, ...]] | None:
              if raw is None:
                  return None
              if not isinstance(raw, (list, tuple)) or len(raw) < pcp_world_size:
                  raise ValueError(
                      "segments must be a JSON list with at least one segment per PCP rank"
                  )

              weights: list[float] = []
              owners: list[int] = []
              for index, item in enumerate(raw):
                  if not isinstance(item, dict) or set(item) - {"weight", "pcp_rank"}:
                      raise ValueError(
                          f"segments[{index}] must contain only weight and pcp_rank"
                      )
                  if "pcp_rank" not in item:
                      raise ValueError(f"segments[{index}].pcp_rank is required")
                  try:
                      weight = float(item.get("weight", 1.0))
                  except (TypeError, ValueError) as exc:
                      raise ValueError(f"segments[{index}].weight must be numeric") from exc
                  if not math.isfinite(weight) or weight <= 0:
                      raise ValueError(
                          f"segments[{index}].weight must be finite and positive"
                      )
                  rank = item["pcp_rank"]
                  if (
                      not isinstance(rank, int)
                      or isinstance(rank, bool)
                      or not 0 <= rank < pcp_world_size
                  ):
                      raise ValueError(
                          f"segments[{index}].pcp_rank must be in [0, {pcp_world_size})"
                      )
                  weights.append(weight)
                  owners.append(rank)

              missing = set(range(pcp_world_size)) - set(owners)
              if missing:
                  raise ValueError(
                      "segments[].pcp_rank must cover every PCP rank; "
                      f"missing={sorted(missing)}"
                  )
              return tuple(weights), tuple(owners)


          def is_rank_permutation(
              segment_to_rank: tuple[int, ...], pcp_world_size: int
          ) -> bool:
              return len(segment_to_rank) == pcp_world_size and sorted(segment_to_rank) == list(
                  range(pcp_world_size)
              )


          def _object(raw: object, name: str) -> dict:
              if raw is None:
                  return {}
              if not isinstance(raw, dict):
                  raise ValueError(f"{name} must be a JSON object")
              return raw


          def _positive_int(raw: object, name: str, default: int) -> int:
              value = default if raw is None else raw
              if not isinstance(value, int) or isinstance(value, bool) or value <= 0:
                  raise ValueError(f"{name} must be a positive integer")
              return value


          def parse_pcp_runahead_config(
              additional_config: object,
              pcp_world_size: int,
          ) -> PCPRunaheadConfig | None:
              if not isinstance(additional_config, dict):
                  return None
              if "pcp_runahead_weights" in additional_config:
                  raise ValueError(
                      "pcp_runahead_weights was removed; use "
                      "pcp_runahead.partition.weights"
                  )
              raw = additional_config.get(RUNAHEAD_CONFIG_KEY)
              if raw in (None, False):
                  return None
              if not isinstance(raw, dict) or not raw:
                  raise ValueError(f"{RUNAHEAD_CONFIG_KEY} must be a non-empty JSON object")
              unknown = set(raw) - {"transport", "partition", "eligibility", "runtime"}
              if unknown:
                  raise ValueError(
                      f"unsupported {RUNAHEAD_CONFIG_KEY} keys: {sorted(unknown)}"
                  )

              transport = raw.get("transport", "prefix_p2p")
              if transport not in (
                  "full_kv_collective",
                  "prefix_p2p",
                  "direct_p2p",
                  "page_pull",
              ):
                  raise ValueError(f"unsupported PCP runahead transport: {transport!r}")

              partition = _object(raw.get("partition"), "pcp_runahead.partition")
              unknown = set(partition) - {"weights", "segments"}
              if unknown:
                  raise ValueError(f"unsupported partition keys: {sorted(unknown)}")
              parsed_segments = parse_runahead_segments(
                  partition.get("segments"), pcp_world_size
              )
              if parsed_segments is not None and "weights" in partition:
                  raise ValueError(
                      "partition.weights and partition.segments are mutually exclusive"
                  )
              if parsed_segments is None:
                  weights = parse_runahead_weights(
                      partition.get("weights"), pcp_world_size
                  )
                  weights = weights or (1.0,) * pcp_world_size
                  segment_to_rank = tuple(range(pcp_world_size))
              else:
                  weights, segment_to_rank = parsed_segments

              if transport != "page_pull" and not is_rank_permutation(
                  segment_to_rank, pcp_world_size
              ):
                  raise ValueError(
                      f"transport={transport} requires one logical segment per PCP rank; "
                      "repeated segment bindings require transport=page_pull"
                  )

              eligibility = _object(raw.get("eligibility"), "pcp_runahead.eligibility")
              unknown = set(eligibility) - {"min_tokens"}
              if unknown:
                  raise ValueError(f"unsupported eligibility keys: {sorted(unknown)}")
              min_tokens = eligibility.get("min_tokens", RUNAHEAD_MIN_PREFILL_TOKENS)
              if (
                  not isinstance(min_tokens, int)
                  or isinstance(min_tokens, bool)
                  or min_tokens < 0
              ):
                  raise ValueError(
                      "eligibility.min_tokens must be a non-negative integer"
                  )

              runtime = _object(raw.get("runtime"), "pcp_runahead.runtime")
              unknown = set(runtime) - {
                  "max_inflight_sends",
                  "max_inflight_reads",
                  "nixl_backends",
              }
              if unknown:
                  raise ValueError(f"unsupported runtime keys: {sorted(unknown)}")
              max_inflight_sends = _positive_int(
                  runtime.get("max_inflight_sends"), "runtime.max_inflight_sends", 4
              )
              max_inflight_reads = _positive_int(
                  runtime.get("max_inflight_reads"), "runtime.max_inflight_reads", 4
              )
              backends_raw = runtime.get("nixl_backends", ["UCX"])
              if (
                  not isinstance(backends_raw, (list, tuple))
                  or not backends_raw
                  or any(not isinstance(item, str) or not item for item in backends_raw)
              ):
                  raise ValueError(
                      "runtime.nixl_backends must be a non-empty string list"
                  )

              return PCPRunaheadConfig(
                  pcp_world_size=pcp_world_size,
                  transport=transport,
                  weights=weights,
                  segment_to_rank=segment_to_rank,
                  min_tokens=min_tokens,
                  max_inflight_sends=max_inflight_sends,
                  max_inflight_reads=max_inflight_reads,
                  nixl_backends=tuple(backends_raw),
              )


          def get_pcp_process_group_order(
              additional_config: object,
              pcp_world_size: int,
          ) -> tuple[int, ...]:
              """Physical PCP members ordered by logical segment rank."""
              config = parse_pcp_runahead_config(additional_config, pcp_world_size)
              if config is None or not config.mapping_is_permutation:
                  return tuple(range(pcp_world_size))
              return config.segment_to_rank
          '''.replace("\n          ", "\n").lstrip())

          # -----------------------------------------------------------------
          # Primary PCP communicator owns permutation binding from startup.
          # -----------------------------------------------------------------
          replace(
              "vllm/distributed/parallel_state.py",
              '''    if enable_elastic_ep:\n        group_ranks = (\n            local_all_ranks.transpose(1, 2)\n            .reshape(-1, prefill_context_model_parallel_size)\n            .unbind(0)\n        )\n        group_ranks = [x.tolist() for x in group_ranks]\n    _PCP = init_model_parallel_group(\n        group_ranks, get_world_group().local_rank, backend, group_name="pcp"\n    )\n''',
              '''    if enable_elastic_ep:\n        group_ranks = (\n            local_all_ranks.transpose(1, 2)\n            .reshape(-1, prefill_context_model_parallel_size)\n            .unbind(0)\n        )\n        group_ranks = [x.tolist() for x in group_ranks]\n\n    from vllm.v1.worker.gpu.pcp_runahead_config import (\n        get_pcp_process_group_order,\n    )\n\n    pcp_order = get_pcp_process_group_order(\n        config.additional_config, prefill_context_model_parallel_size\n    )\n    if pcp_order != tuple(range(prefill_context_model_parallel_size)):\n        group_ranks = [\n            [ranks[physical_rank] for physical_rank in pcp_order]\n            for ranks in group_ranks\n        ]\n\n    _PCP = init_model_parallel_group(\n        group_ranks, get_world_group().local_rank, backend, group_name="pcp"\n    )\n''',
          )

          # -----------------------------------------------------------------
          # BlockTables: retain an exact CPU shadow of kernel block IDs. This
          # makes page-plan compilation CPU-only and removes slot-map readback.
          # -----------------------------------------------------------------
          replace(
              "vllm/v1/worker/gpu/block_table.py",
              '''        self.num_kv_cache_groups = len(self.block_sizes)\n        assert len(max_num_blocks_per_group) == self.num_kv_cache_groups\n\n        self.blocks_per_kv_block = [\n''',
              '''        self.num_kv_cache_groups = len(self.block_sizes)\n        assert len(max_num_blocks_per_group) == self.num_kv_cache_groups\n        self._block_ids_cpu: list[list[list[int]]] = [\n            [[] for _ in range(self.max_num_reqs)]\n            for _ in range(self.num_kv_cache_groups)\n        ]\n\n        self.blocks_per_kv_block = [\n''',
          )
          replace(
              "vllm/v1/worker/gpu/block_table.py",
              '''            if bpk > 1:\n                block_ids = [b * bpk + k for b in block_ids for k in range(bpk)]\n            self.block_tables[i].stage_write(req_index, start, block_ids)\n            self.num_blocks.np[i, req_index] = start + len(block_ids)\n\n    def apply_staged_writes(self) -> None:\n''',
              '''            if bpk > 1:\n                block_ids = [b * bpk + k for b in block_ids for k in range(bpk)]\n            shadow = self._block_ids_cpu[i][req_index]\n            if overwrite:\n                shadow.clear()\n            elif start != len(shadow):\n                raise RuntimeError(\n                    "CPU/GPU block-table mirrors diverged: "\n                    f"group={i}, req={req_index}, start={start}, cpu={len(shadow)}"\n                )\n            shadow.extend(block_ids)\n            self.block_tables[i].stage_write(req_index, start, block_ids)\n            self.num_blocks.np[i, req_index] = start + len(block_ids)\n\n    def get_block_ids_cpu(\n        self,\n        group_idx: int,\n        req_index: int,\n        start_block: int = 0,\n        end_block: int | None = None,\n    ) -> tuple[int, ...]:\n        row = self._block_ids_cpu[group_idx][req_index]\n        stop = len(row) if end_block is None else end_block\n        if not 0 <= start_block <= stop <= len(row):\n            raise IndexError(\n                "invalid CPU block-table slice: "\n                f"group={group_idx}, req={req_index}, "\n                f"slice=({start_block}, {stop}), blocks={len(row)}"\n            )\n        return tuple(row[start_block:stop])\n\n    def apply_staged_writes(self) -> None:\n''',
          )

          # -----------------------------------------------------------------
          # Manager: one PCP rank coordinate, one SegmentLayout compilation,
          # CPU-only page plan, no manager-owned communicator or class config.
          # P2P transports are intentionally retained.
          # -----------------------------------------------------------------
          Path("vllm/v1/worker/gpu/pcp_runahead_manager.py").write_text(r'''# SPDX-License-Identifier: Apache-2.0
          # SPDX-FileCopyrightText: Copyright contributors to the vLLM project
          """PCP manager extension for causal-prefix runahead."""

          from __future__ import annotations

          import math
          from dataclasses import dataclass

          import numpy as np
          import torch

          from vllm.config import CUDAGraphMode, VllmConfig, get_current_vllm_config
          from vllm.distributed.parallel_state import get_pcp_group
          from vllm.logger import init_logger
          from vllm.v1.attention.ops.pcp_page_pull import PCPPagePlan
          from vllm.v1.attention.ops.pcp_profile import pcp_nvtx_range
          from vllm.v1.attention.ops.pcp_runahead import (
              PCPRunaheadRuntime,
              register_pcp_runahead_runtime,
          )
          from vllm.v1.worker.gpu.block_table import BlockTables
          from vllm.v1.worker.gpu.input_batch import InputBatch, InputBuffers
          from vllm.v1.worker.gpu.pcp_manager import PCPManager, RankSegment
          from vllm.v1.worker.gpu.pcp_runahead_config import (
              RUNAHEAD_MIN_PREFILL_TOKENS,
              PCPRunaheadConfig,
              parse_pcp_runahead_config,
              parse_runahead_weights,
          )
          from vllm.v1.worker.gpu.states import RequestState

          logger = init_logger(__name__)


          @dataclass(frozen=True)
          class LogicalSegment:
              global_batch_req_idx: int
              start_pos: int
              end_pos: int
              owner_rank: int


          @dataclass(frozen=True)
          class SegmentLayout:
              """One compilation of logical segments for the current global batch."""

              segments_by_rank: tuple[tuple[RankSegment, ...], ...]
              rows_per_rank: tuple[int, ...]
              logical_segments: tuple[tuple[LogicalSegment, ...], ...]


          def weighted_partition_lengths(
              num_tokens: int,
              weights: tuple[float, ...],
              *,
              start_pos: int = 0,
              alignment: int = 1,
          ) -> tuple[int, ...]:
              if num_tokens < 0:
                  raise ValueError(f"num_tokens must be non-negative, got {num_tokens}")
              if not weights:
                  raise ValueError("weighted PCP partition requires at least one weight")
              if alignment <= 0:
                  raise ValueError(f"alignment must be positive, got {alignment}")

              total_weight = sum(weights)
              if not math.isfinite(total_weight) or total_weight <= 0.0:
                  raise ValueError(f"invalid PCP load weights: {weights}")
              num_segments = len(weights)
              if num_tokens == 0:
                  return (0,) * num_segments

              if alignment == 1 or num_tokens < num_segments * alignment:
                  ideal = [num_tokens * weight / total_weight for weight in weights]
                  lengths = [math.floor(value) for value in ideal]
                  remainder = num_tokens - sum(lengths)
                  order = sorted(
                      range(num_segments),
                      key=lambda segment: (-(ideal[segment] - lengths[segment]), segment),
                  )
                  for segment in order[:remainder]:
                      lengths[segment] += 1
                  return tuple(lengths)

              boundaries = [0]
              cumulative_weight = 0.0
              for segment in range(num_segments - 1):
                  cumulative_weight += weights[segment]
                  ideal_abs = start_pos + num_tokens * cumulative_weight / total_weight
                  min_cut = boundaries[-1] + 1
                  max_cut = num_tokens - (num_segments - segment - 1)
                  min_abs = start_pos + min_cut
                  max_abs = start_pos + max_cut
                  candidate_abs = int(round(ideal_abs / alignment)) * alignment
                  if candidate_abs < min_abs:
                      candidate_abs = math.ceil(min_abs / alignment) * alignment
                  if candidate_abs > max_abs:
                      candidate_abs = math.floor(max_abs / alignment) * alignment
                  if candidate_abs < min_abs or candidate_abs > max_abs:
                      candidate_abs = min(max(int(round(ideal_abs)), min_abs), max_abs)
                  boundaries.append(candidate_abs - start_pos)
              boundaries.append(num_tokens)
              return tuple(
                  boundaries[index + 1] - boundaries[index]
                  for index in range(num_segments)
              )


          def runahead_batch_eligible(
              *,
              num_reqs: int,
              is_prefilling: np.ndarray,
              num_scheduled_tokens: np.ndarray,
              num_computed_tokens: np.ndarray,
              prefill_len: np.ndarray,
              pcp_world_size: int,
              require_full_prefill: bool = True,
              min_prefill_tokens: int = RUNAHEAD_MIN_PREFILL_TOKENS,
          ) -> bool:
              if num_reqs <= 0 or not bool(is_prefilling[:num_reqs].all()):
                  return False
              if require_full_prefill:
                  if not bool((num_computed_tokens[:num_reqs] == 0).all()):
                      return False
                  if not bool(
                      (num_scheduled_tokens[:num_reqs] == prefill_len[:num_reqs]).all()
                  ):
                      return False
              total_prefill_tokens = int(num_scheduled_tokens[:num_reqs].sum())
              return total_prefill_tokens >= max(pcp_world_size, min_prefill_tokens)


          class RunaheadPCPManager(PCPManager):
              def __init__(
                  self,
                  pcp_world_size: int,
                  pcp_rank: int,
                  device: torch.device,
                  req_states: RequestState | None = None,
                  max_num_reqs: int | None = None,
                  max_num_tokens: int | None = None,
                  block_tables: BlockTables | None = None,
                  dcp_world_size: int = 1,
                  dcp_rank: int = 0,
                  cp_interleave: int = 1,
              ) -> None:
                  vllm_config = get_current_vllm_config()
                  config = parse_pcp_runahead_config(
                      vllm_config.additional_config, pcp_world_size
                  )
                  if config is None:
                      raise RuntimeError("PCP runahead manager requires an enabled config")
                  self._config = config

                  super().__init__(
                      pcp_world_size=pcp_world_size,
                      pcp_rank=pcp_rank,
                      device=device,
                      req_states=req_states,
                      max_num_reqs=max_num_reqs,
                      max_num_tokens=max_num_tokens,
                      block_tables=block_tables,
                      dcp_world_size=dcp_world_size,
                      dcp_rank=dcp_rank,
                      cp_interleave=cp_interleave,
                  )
                  self._standard_attention_pcp = False
                  self._use_custom_partition = False
                  self._use_compact_layout = False
                  self._active_layout: SegmentLayout | None = None
                  self._step_transport: str | None = None
                  self._page_alignment = (
                      math.lcm(*block_tables.kernel_block_sizes)
                      if config.transport == "page_pull"
                      and block_tables is not None
                      and block_tables.kernel_block_sizes
                      else 1
                  )
                  if (
                      config.transport == "page_pull"
                      and block_tables is not None
                      and block_tables.num_kv_cache_groups != 1
                  ):
                      raise NotImplementedError(
                          "PCP page_pull currently supports one standard-attention KV "
                          f"cache group, got {block_tables.num_kv_cache_groups}"
                      )

                  self._sharded_kv_history = False
                  self._runahead_runtime = PCPRunaheadRuntime(
                      pcp_world_size=pcp_world_size,
                      pcp_rank=pcp_rank,
                      device=device,
                      max_inflight_sends=config.max_inflight_sends,
                      max_inflight_reads=config.max_inflight_reads,
                      nixl_backends=config.nixl_backends,
                      pcp_group=get_pcp_group(),
                  )
                  register_pcp_runahead_runtime(self._runahead_runtime)
                  self._resize_local_request_buffers_if_needed(
                      max_num_reqs=max_num_reqs,
                      max_num_tokens=max_num_tokens,
                      block_tables=block_tables,
                      device=device,
                  )

              def _compact_layout_enabled(self) -> bool:
                  return self._use_compact_layout

              def _resize_local_request_buffers_if_needed(
                  self,
                  *,
                  max_num_reqs: int | None,
                  max_num_tokens: int | None,
                  block_tables: BlockTables | None,
                  device: torch.device,
              ) -> None:
                  mapping = self._config.logical_segment_to_rank
                  max_segments_per_rank = max(
                      mapping.count(rank) for rank in range(self.pcp_world_size)
                  )
                  if (
                      max_segments_per_rank <= 2
                      or max_num_reqs is None
                      or max_num_tokens is None
                  ):
                      return
                  max_num_local_reqs = max_segments_per_rank * max_num_reqs
                  self._input_buffers = InputBuffers(
                      max_num_local_reqs, max_num_tokens, device
                  )
                  self._local_req_idx = torch.arange(
                      max_num_local_reqs, dtype=torch.int32, device=device
                  )
                  if block_tables is not None:
                      self._local_block_tables = tuple(
                          table.new_zeros((max_num_local_reqs, table.shape[1]))
                          for table in block_tables.input_block_tables
                      )
                      self._local_block_table_ptrs = torch.tensor(
                          [table.data_ptr() for table in self._local_block_tables],
                          dtype=torch.uint64,
                          device=device,
                      )

              def set_standard_attention(self, enabled: bool) -> None:
                  self._standard_attention_pcp = enabled

              @classmethod
              def validate_config(
                  cls,
                  vllm_config: VllmConfig,
                  supports_mm_inputs: bool,
              ) -> None:
                  parallel = vllm_config.parallel_config
                  model = vllm_config.model_config
                  assert model is not None
                  config = parse_pcp_runahead_config(
                      vllm_config.additional_config,
                      parallel.prefill_context_parallel_size,
                  )
                  if config is None:
                      raise ValueError("pcp_runahead manager requires an enabled config")

                  if model.use_mla:
                      raise NotImplementedError(
                          "PCP runahead currently supports standard attention only"
                      )
                  if model.is_encoder_decoder:
                      raise NotImplementedError(
                          "PCP runahead does not support encoder-decoder"
                      )
                  if supports_mm_inputs:
                      raise NotImplementedError("PCP runahead does not support MM inputs")
                  if vllm_config.lora_config is not None:
                      raise NotImplementedError("PCP runahead does not support LoRA")
                  if vllm_config.speculative_config is not None:
                      raise NotImplementedError(
                          "PCP runahead does not support speculative decoding"
                      )
                  if parallel.tensor_parallel_size != 1:
                      raise NotImplementedError("PCP runahead requires TP=1")
                  if parallel.pipeline_parallel_size != 1:
                      raise NotImplementedError("PCP runahead requires PP=1")
                  if parallel.data_parallel_size != 1:
                      raise NotImplementedError("PCP runahead requires DP=1")
                  if parallel.decode_context_parallel_size != 1:
                      raise NotImplementedError("PCP runahead requires DCP=1")
                  if parallel.enable_expert_parallel or model.is_moe:
