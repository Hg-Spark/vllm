name: Apply PCP Runahead MVP

on:
  push:
    branches:
      - agent/pcp-runahead-mvp

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pcp-runahead-mvp
          fetch-depth: 0

      - name: Reconstruct and apply patch
        shell: bash
        run: |
          set -euo pipefail
          cat .agent/pcp_payload/part_* | base64 -d > /tmp/pcp-runahead.zip
          rm -rf /tmp/pcp-runahead
          mkdir -p /tmp/pcp-runahead
          python -m zipfile -e /tmp/pcp-runahead.zip /tmp/pcp-runahead
          python /tmp/pcp-runahead/vllm_pcp_runahead_split/merge_all.py .

      - name: Validate source changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python -m py_compile \
            vllm/config/parallel.py \
            vllm/engine/arg_utils.py \
            vllm/v1/worker/gpu/pcp_manager.py \
            vllm/v1/attention/ops/pcp_runahead.py \
            vllm/model_executor/layers/attention/pcp.py \
            vllm/model_executor/layers/attention/mla_attention.py \
            vllm/model_executor/layers/sparse_attn_indexer.py \
            vllm/v1/worker/gpu/model_runner.py \
            tests/v1/worker/gpu/test_pcp_runahead.py

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            vllm/config/parallel.py \
            vllm/engine/arg_utils.py \
            vllm/v1/worker/gpu/pcp_manager.py \
            vllm/v1/attention/ops/pcp_runahead.py \
            vllm/model_executor/layers/attention/pcp.py \
            vllm/model_executor/layers/attention/mla_attention.py \
            vllm/model_executor/layers/sparse_attn_indexer.py \
            vllm/v1/worker/gpu/model_runner.py \
            tests/v1/worker/gpu/test_pcp_runahead.py
          if git diff --cached --quiet; then
            echo 'No implementation changes to commit.'
            exit 0
          fi
          git commit -m 'Add experimental PCP KV runahead MVP'
          git push origin HEAD:agent/pcp-runahead-mvp
